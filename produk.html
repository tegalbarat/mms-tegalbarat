<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produk Pembiayaan – MMS Tegal Barat | BTPN Syariah</title>
  <meta name="description" content="Tepat Pembiayaan Syariah Kelompok: pengajuan mulai Rp 2 juta, tanpa agunan, jangka waktu 1 sampai 2 tahun. Hitung setoran Anda di sini." />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body>
  <div id="nav"></div><div id="banner"></div>
  <div class="border-b border-slate-200 bg-white"><div id="sub" class="wrap flex gap-2 overflow-x-auto py-3"></div></div>

  <main>
    <section id="ringkasan" class="scroll-mt-24 py-16 md:py-20"><div class="wrap">
      <div id="hRingkas"></div><div id="ringkas"></div>
      <div id="dua" class="mt-6 grid gap-6 md:grid-cols-2"></div>
    </div></section>

    <section id="tabungan" class="scroll-mt-24 bg-slate-50 py-16 md:py-20"><div class="wrap">
      <div id="hTab"></div><div id="tabBox" class="mt-10 grid gap-6 md:grid-cols-2"></div>
    </div></section>

    <!-- KALKULATOR -->
    <section id="kalkulator" class="scroll-mt-24 py-16 md:py-20"><div class="wrap">
      <div id="hHitung"></div>
      <div class="mt-8 grid items-start gap-8 lg:grid-cols-2">
        <div class="reveal card space-y-8">
          <div>
            <div class="flex items-baseline justify-between"><label for="plafon" class="font-bold">Modal yang dibutuhkan</label><output id="plafonOut" class="font-display text-xl font-bold text-brand"></output></div>
            <div class="mt-3 flex items-center gap-3">
              <button id="kurang" type="button" aria-label="Kurangi Rp 1 juta" class="h-11 w-11 shrink-0 rounded-xl border-2 border-brand text-xl font-bold text-brand hover:bg-brand-tint">−</button>
              <input id="plafon" type="range" min="2" max="100" step="1" value="2" class="w-full accent-brand" />
              <button id="tambah" type="button" aria-label="Tambah Rp 1 juta" class="h-11 w-11 shrink-0 rounded-xl border-2 border-brand text-xl font-bold text-brand hover:bg-brand-tint">+</button>
            </div>
            <div class="mt-1 flex justify-between text-xs text-ink/60"><span>Rp 2 juta</span><span>Rp 100 juta</span></div>
            <p class="mt-2 text-xs text-ink/70">Pinjaman dalam kelipatan Rp 1 juta.</p>
          </div>
          <div>
            <p class="font-bold">Jangka waktu</p>
            <div id="tenor" class="mt-3 grid gap-2 sm:grid-cols-3"></div>
            <p id="tenorInfo" class="mt-3 text-xs leading-relaxed text-ink/70"></p>
          </div>
        </div>
        <div class="reveal card border-brand/40 bg-brand-tint" aria-live="polite">
          <p class="eyebrow">Perkiraan setoran</p>
          <p id="hasil" class="font-display text-4xl font-bold text-brand md:text-5xl"></p>
          <p class="text-sm font-semibold">setiap 2 minggu (angsuran + tabungan)</p>
          <dl id="rinci" class="mt-6 divide-y divide-brand/20 text-[15px]"></dl>
          <p class="mt-5 text-xs leading-relaxed text-ink/70">Perkiraan. Tabungan tiap pertemuan bersifat ajakan sesuai kemampuan: jika hanya mampu membayar angsuran, tetap diterima. Angka pasti tertulis di akad Anda.</p>
        </div>
      </div>
    </div></section>

    <section id="syarat" class="scroll-mt-24 bg-slate-50 py-16 md:py-20"><div class="wrap grid gap-10 lg:grid-cols-2">
      <div id="cSyarat"></div><div id="cLangkah"></div>
    </div></section>

    <section id="manfaat" class="scroll-mt-24 py-16 md:py-20"><div class="wrap">
      <div id="hManfaat"></div><div id="manfaatList"></div>
      <div id="risiko" class="reveal card mt-8 border-brand/40"></div>
      <div class="mt-8" id="catatan"></div>
    </div></section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js"></script><script src="js/layout.js"></script>
  <script>
    renderLayout("produk.html");
    pageBanner("Produk Pembiayaan", "Tepat Pembiayaan Syariah – Kelompok: modal usaha tanpa agunan, dicicil setiap 2 minggu bersama sentra.");

    $("sub").innerHTML = [["#ringkasan", "Ringkasan"], ["#tabungan", "Tabungan"], ["#kalkulator", "Hitung Cicilan"], ["#syarat", "Syarat & Cara"], ["#manfaat", "Manfaat & Risiko"]]
      .map(([h, l]) => `<a href="${h}" class="chip shrink-0 !px-4 !py-2 hover:bg-brand hover:text-white">${l}</a>`).join("");

    const box = (t, h) => `<div class="reveal card"><h3 class="font-display text-lg font-bold text-brand">${t}</h3><div class="mt-4">${h}</div></div>`;
    $("hRingkas").innerHTML = secHead("Ringkasan Produk", TEPAT.nama, TEPAT.intro);
    $("ringkas").innerHTML = `<div class="mt-10 grid grid-cols-2 gap-4 md:grid-cols-4">${TEPAT.ringkas.map(([t, v, s]) => `<div class="reveal card text-center"><p class="text-[11px] font-bold uppercase tracking-widest text-ink/60">${t}</p><p class="mt-2 font-display text-lg font-bold text-brand md:text-xl">${v}</p><p class="mt-1 text-xs text-ink/70">${s}</p></div>`).join("")}</div>`;
    $("dua").innerHTML = box("Yang Anda dapatkan", checkList(TEPAT.poin.map(([t, d]) => `<b>${t}.</b> ${d}`))) + box("Jenis fasilitas", checkList(TEPAT.fasilitas));

    $("hTab").innerHTML = secHead("Soal Tabungan", "Anda meminjam sambil menabung.", "Pembiayaan kelompok mengajak nasabah membangun tabungan. Ini penjelasannya.");
    $("tabBox").innerHTML =
      `<div class="reveal card"><p class="eyebrow">Saat pembiayaan cair</p><p class="font-display text-3xl font-bold text-brand">10% dari pinjaman</p><p class="mt-3 text-[15px] leading-relaxed">${TEPAT.tabungan.awal}</p></div>
       <div class="reveal card"><p class="eyebrow">Di setiap pertemuan</p><p class="font-display text-3xl font-bold text-brand">0,8% dari pinjaman</p><p class="mt-3 text-[15px] leading-relaxed">${TEPAT.tabungan.rutin}</p></div>`;

    // ===== Kalkulator =====
    $("hHitung").innerHTML = secHead("Hitung Cicilan", "Berapa setoran Anda tiap 2 minggu?", "Geser untuk memilih besar pinjaman. Pilihan jangka waktu menyesuaikan otomatis.");
    let n = 25;
    const slider = $("plafon");
    function run() {
      const p = +slider.value * 1000000, ok = tenorTersedia(p);
      if (!ok.includes(n)) n = Math.max(...ok.filter((x) => x <= n));
      $("plafonOut").textContent = rupiah(p);
      $("tenor").innerHTML = TEPAT.tenor.map((t) => {
        const on = ok.includes(t.n), sel = t.n === n;
        return `<button type="button" data-n="${t.n}" ${on ? "" : "disabled"} class="rounded-xl border-2 px-3 py-3 text-left text-sm font-bold transition ${sel ? "border-brand bg-brand text-white" : on ? "border-brand text-brand hover:bg-brand-tint" : "cursor-not-allowed border-slate-200 text-ink/40"}">${t.label}<span class="block text-xs font-medium">${t.n} kali angsuran</span></button>`;
      }).join("");
      $("tenor").querySelectorAll("[data-n]:not([disabled])").forEach((b) => (b.onclick = () => { n = +b.dataset.n; run(); }));
      $("tenorInfo").textContent = p <= 5000000 ? "Pinjaman Rp 2 – 5 juta tersedia untuk jangka waktu 1 tahun." : p <= 20000000 ? "Pinjaman Rp 6 – 20 juta dapat memilih 1 tahun atau 1,5 tahun." : "Pinjaman di atas Rp 20 juta dapat memilih 1 tahun, 1,5 tahun, atau 2 tahun.";
      const r = hitungKelompok(p, n), t = TEPAT.tenor.find((x) => x.n === n);
      $("hasil").textContent = rupiah(r.setoran);
      $("rinci").innerHTML = [["Modal yang diterima", rupiah(p)], ["Jangka waktu", `${t.label} · ${n} kali`], ["Angsuran tiap 2 minggu", rupiah(r.angsuran)], ["Tabungan tiap 2 minggu (0,8%)", rupiah(r.tabungan)], ["Tabungan awal saat cair (10%)", rupiah(r.tabunganAwal)]]
        .map(([a, b]) => `<div class="flex justify-between gap-3 py-3"><dt>${a}</dt><dd class="text-right font-bold">${b}</dd></div>`).join("");
    }
    slider.addEventListener("input", run);
    $("kurang").onclick = () => { slider.value = Math.max(+slider.min, +slider.value - 1); run(); };
    $("tambah").onclick = () => { slider.value = Math.min(+slider.max, +slider.value + 1); run(); };
    run();

    // Syarat + langkah + manfaat + risiko
    $("cSyarat").innerHTML = secHead("Syarat", "Siapa yang dapat mengajukan?") + `<div class="reveal card mt-8">${checkList(TEPAT.syarat)}</div>`;
    $("cLangkah").innerHTML = secHead("Cara Mengajukan", "Lima langkah sampai pembiayaan cair.") +
      `<ol class="mt-8 space-y-5">${TEPAT.langkah.map(([t, d], i) => `<li class="reveal flex gap-4"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand font-display font-bold text-white">${i + 1}</span><div class="pt-0.5"><h3 class="font-bold">${t}</h3><p class="mt-1 text-[15px] leading-relaxed text-ink/80">${d}</p></div></li>`).join("")}</ol>`;
    $("hManfaat").innerHTML = secHead("Manfaat & Risiko", "Perlindungan dan pendampingan, bukan hanya modal.");
    $("manfaatList").innerHTML = `<div class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${TEPAT.manfaat.map(([t, d], i) => `<div class="reveal card"><div class="icon-box font-display text-lg font-bold">${i + 1}</div><h3 class="mt-4 font-display font-bold text-brand">${t}</h3><p class="mt-2 text-[15px] leading-relaxed">${d}</p></div>`).join("")}</div>`;
    $("risiko").innerHTML = `<h3 class="font-display text-lg font-bold text-brand">Hal yang perlu Anda ketahui</h3><div class="mt-4">${TEPAT.risiko.map((t) => `<p class="flex gap-3 border-b border-slate-100 py-3 text-[15px] leading-relaxed last:border-0">${I.warn}<span>${t}</span></p>`).join("")}</div>`;
    $("catatan").innerHTML = notice(SITE.disclaimer);

    reveal();
  </script>
</body>
</html>
